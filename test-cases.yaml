spatial-grouper:
  name: Spatial Grouper
  description: >-
    Mocked IO — exercises the spatial grouper: trajectories and events split
    by the mocked spatial feature group regions.
  mock_io: true
  params:
    workflow_details:
      name: "Patrol Encounter Rate Map"
      description: "Analyze patrol encounter rates with events, grouped by spatial features."
    er_client_name:
      data_source:
        name: "mep_dev"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "Africa/Nairobi (UTC+03:00)"
        tzCode: "Africa/Nairobi"
        name: "(UTC+03:00) Nairobi"
        utc: "+03:00"
    er_patrol_and_events_params:
      patrol_types: ["ecoscope_patrol"]
      status: ["done"]
      event_types: []
    groupers:
      groupers:
        # Must match the mock feature group's metadata.display_name — the
        # resolve task keys its lookup on that, not on the requested name.
        - spatial_index_name: "SpatialGrouperTest"
    patrol_filters:
      trajectory_segment_filter:
        min_length_meters: 0.001
        max_length_meters: 10000.0
        max_time_secs: 3600.0
        min_time_secs: 1.0
        max_speed_kmhr: 120.0
        min_speed_kmhr: 0.01
      bounding_box:
        min_x: -180.0
        max_x: 180.0
        min_y: -90.0
        max_y: 90.0
      filter_point_coords:
        - {x: 180.0, y: 90.0}
        - {x: 0.0, y: 0.0}
        - {x: 1.0, y: 1.0}
    encounter_meshgrid:
      auto_scale_or_custom_cell_size:
        auto_scale_or_custom: "Customize"
        grid_cell_size: 5000
    base_map_defs:
      base_maps:
        - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"
          opacity: 1.0
        - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
          opacity: 0.5
          max_zoom: 17

