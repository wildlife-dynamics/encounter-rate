id: encounter_rate

requirements:
  - name: "ecoscope-platform"
    version: "2.11.6"
    channel: "https://repo.prefix.dev/ecoscope-workflows/"
  - name: ecoscope-workflows-ext-custom
    version: "0.1.0rc4"
    channel: "https://repo.prefix.dev/ecoscope-workflows-custom/"

rjsf-overrides:
  properties:
    Patrol and Event Types.properties.er_patrol_and_events_params.properties.patrol_types.description: >-
      Specify the patrol type(s) to analyze. Enter the "Patrol Types" value for each patrol type — one per field (e.g. "ecoscope_patrol"). Leave empty to include all patrol types.
    Patrol and Event Types.properties.er_patrol_and_events_params.properties.patrol_types.default: []
    Patrol and Event Types.properties.er_patrol_and_events_params.properties.event_types.description: >-
      Specify the event type(s) to include. Enter the "Event Types" value for each event type — one per field (e.g. "wildlife_sighting_rep"). Leave empty to include all event types.
    Patrol and Event Types.properties.er_patrol_and_events_params.properties.event_types.default: []
    Patrol and Event Types.properties.er_patrol_and_events_params.properties.status.default: ["done"]
    Process Patrol Observations.properties.groupers.properties.groupers.items.anyOf:
      - {"$ref": "#/$defs/ValueGrouper"}
      - {"$ref": "#/$defs/TemporalGrouper"}
    Process Patrol Observations.properties.set_patrol_traj_color_column.properties.var.title: "Category"
    Process Patrol Observations.properties.set_patrol_traj_color_column.properties.var.default: "patrol_subject"
    Process Patrol Observations.properties.set_patrol_traj_color_column.properties.var.description: >-
      Select the patrol observation attribute to use for categorizing and coloring patrol trajectories on the generated maps.
    Process Patrol Observations.properties.set_patrol_traj_color_column.properties.var.oneOf: [
      {"const": "patrol_type", "title": "Patrol Type"},
      {"const": "patrol_status", "title": "Patrol Status"},
      {"const": "patrol_subject", "title": "Patrol Subject"},
      {"const": "patrol_serial_number", "title": "Patrol Serial Number"},
    ]
    Encounter Rate Map.properties.encounter_meshgrid.properties.auto_scale_or_custom_cell_size.default:
      auto_scale_or_custom: "Auto-scale"
    base_map_defs.properties.base_maps.title: "Map Base Layers"
    persist_patrol_traj.properties.filename_prefix.default: "patrol_trajectories"
    persist_patrol_traj.properties.filetypes.default: ["parquet"]
    persist_patrol_traj.properties.filetypes.items.enum: ["csv", "parquet"]
    persist_patrol_events.properties.filename_prefix.default: "patrol_events"
    persist_patrol_events.properties.filetypes.default: ["parquet"]
    persist_patrol_events.properties.filetypes.items.enum: ["csv", "parquet"]
    Generate Report.properties.set_skip_report.properties.var.description: >-
      Skip generating the Word document report. Uncheck to include a summary report in the output.
    Generate Report.properties.set_skip_report.properties.var.default: true
    Generate Report.properties.create_encounter_report.properties.template_path.default: "https://raw.githubusercontent.com/wildlife-dynamics/encounter-rate/main/resources/templates/encounter_rate_template.docx"
  $defs:
    ValueGrouper:
      title: "Category"
      type: "object"
      properties:
        index_name:
          title: "Index Name"
          type: "string"
          oneOf:
            - const: "event_type"
              title: "Event Type"
            - const: "patrol_type"
              title: "Patrol Type"
            - const: "patrol_subject"
              title: "Patrol Subject"
  uiSchema:
    Process Patrol Observations.filter_patrol_obs.filter_point_coords.items.ui:options.label: false
    Process Patrol Events.filter_patrol_events.filter_point_coords.items.ui:options.label: false
    base_map_defs.base_maps.items.ui:options.label: false
    Encounter Rate Map.encounter_meshgrid.auto_scale_or_custom_cell_size:
      anyOf:
        - ui:help: Auto-scale for an optimized grid cell size based on the workflow data or Customize to set a specific grid cell size.
          ui:options.label: false
          auto_scale_or_custom:
            ui:widget: hidden
        - ui:options.label: false
          auto_scale_or_custom:
            ui:widget: hidden

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:
  # ── Setup ──
  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Data Source
    id: er_client_name
    task: set_er_connection

  - name: Time Range
    id: time_range
    task: set_time_range
    partial:
      time_format: "%d %b %Y %H:%M:%S %Z"

  # ── Fetch (single patrol call → two extractions) ──
  - title: Patrol and Event Types
    type: task-group
    description: " "
    tasks:
      - id: er_patrol_and_events_params
        task: set_patrols_and_patrol_events_params
        partial:
          client: ${{ workflow.er_client_name.return }}
          time_range: ${{ workflow.time_range.return }}
          include_patrol_details: true
          raise_on_empty: false
          truncate_to_time_range: true
          sub_page_size: 100
          patrols_overlap_daterange: true
          include_null_geometry: false
      - id: prefetch_patrols
        task: get_patrols_from_combined_params
        partial:
          combined_params: ${{ workflow.er_patrol_and_events_params.return }}
      - id: patrol_obs
        task: get_patrol_observations_from_patrols_df_and_combined_params
        partial:
          patrols_df: ${{ workflow.prefetch_patrols.return }}
          combined_params: ${{ workflow.er_patrol_and_events_params.return }}
      - id: patrol_events
        task: unpack_events_from_patrols_df_and_combined_params
        partial:
          patrols_df: ${{ workflow.prefetch_patrols.return }}
          combined_params: ${{ workflow.er_patrol_and_events_params.return }}
      - id: event_type_display_names
        task: get_event_type_display_names_from_events
        partial:
          client: ${{ workflow.er_client_name.return }}
          events_gdf: ${{ workflow.patrol_events.return }}
          append_category_names: "duplicates"

  - name: Extract Timezone Selection
    id: get_timezone
    task: get_timezone_from_time_range
    partial:
      time_range: ${{ workflow.time_range.return }}

  - name: Convert Patrol Observations to Timezone
    id: convert_patrols_to_tz
    task: convert_values_to_timezone
    partial:
      df: ${{ workflow.patrol_obs.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns: ["fixtime"]

  - name: Convert Patrol Events to Timezone
    id: convert_events_to_tz
    task: convert_values_to_timezone
    partial:
      df: ${{ workflow.event_type_display_names.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns: ["time"]

  # ── Process Patrol Observations → Trajectories ──
  - title: Process Patrol Observations
    type: task-group
    description: >-
      Process patrol observations into trajectories.
    tasks:
      - name: Remove Column Prefix (Observations)
        id: drop_extra_prefix_obs
        task: drop_column_prefix
        partial:
          df: ${{ workflow.convert_patrols_to_tz.return }}
          prefix: "extra__"
          duplicate_strategy: "suffix"

      - name: Filter Observation Relocations
        id: filter_patrol_obs
        task: apply_reloc_coord_filter
        partial:
          df: ${{ workflow.drop_extra_prefix_obs.return }}
          roi_gdf: null
          roi_name: null
          reset_index: false
          bounding_box:
            min_x: -180.0
            max_x: 180.0
            min_y: -90.0
            max_y: 90.0
          filter_point_coords:
            - {x: 180.0, y: 90.0}
            - {x: 0.0, y: 0.0}
            - {x: 1.0, y: 1.0}

      - name: Trajectory Segment Filter
        id: patrol_traj
        task: relocations_to_trajectory
        partial:
          relocations: ${{ workflow.filter_patrol_obs.return }}

      - name: Remove Column Prefix (Trajectories)
        id: drop_extra_prefix_traj
        task: drop_column_prefix
        partial:
          df: ${{ workflow.patrol_traj.return }}
          prefix: "extra__"
          duplicate_strategy: "suffix"

      - name: Internally Process Columns
        id: customize_columns
        task: map_columns
        partial:
          df: ${{ workflow.drop_extra_prefix_traj.return }}
          rename_columns: {}
          drop_columns: ["id"]
          retain_columns: []
          raise_if_not_found: false

      - name: Group Data
        id: groupers
        task: set_groupers

      - name: Style Trajectory By Category
        id: set_patrol_traj_color_column
        task: set_string_var

      - name: Add temporal index to Patrol Trajectories
        id: traj_add_temporal_index
        task: add_temporal_index
        partial:
          df: ${{ workflow.customize_columns.return }}
          time_col: "segment_start"
          groupers: ${{ workflow.groupers.return }}
          cast_to_datetime: true
          format: "mixed"

      - name: Rename value grouper columns for Trajectories
        id: traj_rename_grouper_cols
        task: map_columns
        partial:
          df: ${{ workflow.traj_add_temporal_index.return }}
          drop_columns: ["patrol_type"]
          retain_columns: []
          raise_if_not_found: false
          rename_columns:
            patrol_type__value: "patrol_type"

      - name: Patrol Traj Colormap
        id: traj_colormap
        task: apply_color_map
        partial:
          df: ${{ workflow.traj_rename_grouper_cols.return }}
          colormap: ["#FF9600", "#F23B0E", "#A100CB", "#F04564", "#03421A", "#3089FF", "#E26FFF", "#8C1700", "#002960", "#FFD000", "#B62879", "#680078", "#005A56", "#0056C7", "#331878", "#E76826"]
          input_column_name: ${{ workflow.set_patrol_traj_color_column.return }}
          output_column_name: "patrol_traj_colormap"

  # ── Summarize Patrol Effort (for encounter rate) ──
  - name: Summarize Patrol Effort
    id: patrol_effort_summary
    task: summarize_df
    partial:
      df: ${{ workflow.customize_columns.return }}
      groupby_cols: ["patrol_id"]
      summary_params:
        - display_name: "total_dist_m"
          aggregator: sum
          column: dist_meters
        - display_name: "total_time_s"
          aggregator: sum
          column: timespan_seconds
      reset_index: true

  # ── Process Patrol Events ──
  - title: Process Patrol Events
    type: task-group
    description: >-
      Process patrol events by applying filters, merging effort data, and indexing.
    tasks:
      - name: Remove Column Prefix (Events)
        id: drop_extra_prefix_events
        task: drop_column_prefix
        partial:
          df: ${{ workflow.convert_events_to_tz.return }}
          prefix: "extra__"
          duplicate_strategy: "suffix"

      - name: Apply Coordinate Filter to Patrol Events
        id: filter_patrol_events
        task: apply_reloc_coord_filter
        partial:
          df: ${{ workflow.drop_extra_prefix_events.return }}
          roi_gdf: null
          roi_name: null
          reset_index: true

      - name: Merge Patrol Effort into Events
        id: events_with_effort
        task: merge_two_dataframes
        partial:
          left: ${{ workflow.filter_patrol_events.return }}
          right: ${{ workflow.patrol_effort_summary.return }}
          how: "left"
          on: "patrol_id"
          left_on: null
          right_on: null
          left_index: false
          right_index: false
          fillna_value: null

      - name: Add temporal index to Patrol Events
        id: pe_add_temporal_index
        task: add_temporal_index
        partial:
          df: ${{ workflow.events_with_effort.return }}
          time_col: "patrol_start_time"
          groupers: ${{ workflow.groupers.return }}
          cast_to_datetime: true
          format: "mixed"

      - name: Patrol Events Colormap
        id: pe_colormap
        task: apply_color_map
        partial:
          df: ${{ workflow.pe_add_temporal_index.return }}
          input_column_name: "event_type"
          colormap: "tab20b"
          output_column_name: "event_type_colormap"

  # ── Cast, Split, Persist ──
  - name: Cast Patrol Trajectory Columns
    id: traj_cols_to_string
    task: convert_column_values_to_string
    partial:
      df: ${{ workflow.traj_colormap.return }}
      columns: ["patrol_serial_number", "patrol_type"]

  - name: Cast Patrol Events Columns
    id: pe_cols_to_string
    task: convert_column_values_to_string
    partial:
      df: ${{ workflow.pe_colormap.return }}
      columns: ["patrol_serial_number", "patrol_type"]

  - name: Split Patrol Trajectories by Group
    id: split_traj_groups
    task: split_groups
    partial:
      df: ${{ workflow.traj_cols_to_string.return }}
      groupers: ${{ workflow.groupers.return }}

  - name: Split Patrol Events by Group
    id: split_pe_groups
    task: split_groups
    partial:
      df: ${{ workflow.pe_cols_to_string.return }}
      groupers: ${{ workflow.groupers.return }}

  - name: Map Base Layers
    id: base_map_defs
    task: set_base_maps

  # ── Encounter Rate Grid Map (per group) ──
  - name: Zip Events and Trajectories for Grid
    id: zipped_events_traj
    task: groupbykey
    skipif:
      conditions:
        - any_dependency_skipped
        - all_keyed_iterables_are_skips
      unpack_depth: 1
    partial:
      iterables:
        - ${{ workflow.split_pe_groups.return }}
        - ${{ workflow.split_traj_groups.return }}

  - title: Encounter Rate Map
    type: task-group
    description: >-
      These settings generate a grid-based heatmap showing encounter rate (events per unit of patrol effort in each cell).
    tasks:
      - name: null
        id: encounter_meshgrid
        task: create_meshgrid
        skipif:
          conditions:
            - any_is_empty_df
            - any_dependency_skipped
            - all_geometry_are_none
        partial:
          aoi: ${{ workflow.pe_cols_to_string.return }}
          intersecting_only: true

      - name: Calculate Encounter Rate per Cell
        id: encounter_rate_grid
        task: ecoscope_workflows_ext_custom.tasks.spatial_ops.calculate_encounter_rate_grid
        partial:
          meshgrid: ${{ workflow.encounter_meshgrid.return }}
        mapvalues:
          argnames: feature_layers
          argvalues: ${{ workflow.zipped_events_traj.return }}

      - name: Drop Inactive Grid Cells
        id: drop_inactive_cells
        task: ecoscope_workflows_ext_custom.tasks.spatial_ops.drop_inactive_grid_cells
        partial:
          event_column: "event_count"
          patrol_effort_column: "patrol_effort_km"
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.encounter_rate_grid.return }}

      - name: Fill NaN Encounter Rate With Zero
        id: fill_nan_rate
        task: fill_na
        partial:
          columns: ["density"]
          value: 0
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.drop_inactive_cells.return }}

      - name: Sort Encounter Rate Values
        id: sort_rate_values
        task: sort_values
        partial:
          column_name: "density"
          ascending: true
          na_position: "last"
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.fill_nan_rate.return }}

      - name: Classify Encounter Rate Values
        id: classify_rate
        task: apply_classification
        partial:
          input_column_name: "density"
          output_column_name: "rate_bins"
          classification_options:
            scheme: "equal_interval"
            k: 10
          label_options:
            label_ranges: true
            label_decimals: 2
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.sort_rate_values.return }}

      - name: Encounter Rate Colormap
        id: rate_colormap
        task: apply_color_map
        partial:
          input_column_name: "rate_bins"
          colormap: "RdYlGn_r"
          output_column_name: "rate_colormap"
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.classify_rate.return }}

      - name: Mask Low-Effort Cells Grey
        id: mask_low_effort
        task: ecoscope_workflows_ext_custom.tasks.spatial_ops.mask_low_effort_cells
        partial:
          patrol_effort_column: "patrol_effort_km"
          color_column: "rate_colormap"
          label_column: "rate_bins"
          threshold_km: 0.2
          grey_color: [128, 128, 128, 255]
          grey_label: "< 200 m patrol effort"
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.rate_colormap.return }}

      - id: rename_rate_col
        task: map_columns
        partial:
          drop_columns: []
          retain_columns: []
          rename_columns:
            density: "Encounter Rate (per km)"
            event_count: "Events"
            patrol_effort_km: "Patrol Effort (km)"
          raise_if_not_found: true
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.mask_low_effort.return }}

      - name: Create Encounter Rate Polygon Layer
        id: rate_polygon_layer
        task: create_polygon_layer
        skipif:
          conditions:
            - any_is_empty_df
            - any_dependency_skipped
            - all_geometry_are_none
        partial:
          layer_style:
            fill_color_column: "rate_colormap"
            get_line_width: 0
            opacity: 0.4
          legend:
            label_column: "rate_bins"
            color_column: "rate_colormap"
          tooltip_columns: ["Encounter Rate (per km)", "Events", "Patrol Effort (km)"]
        mapvalues:
          argnames: geodataframe
          argvalues: ${{ workflow.rename_rate_col.return }}

      - name: "Set Rate Map Title"
        id: set_rate_map_title
        task: set_string_var
        partial:
          var: "Encounter Rate Map"

      - name: Draw Encounter Rate Ecomap
        id: rate_ecomap
        task: draw_ecomap
        partial:
          title: null
          tile_layers: ${{ workflow.base_map_defs.return }}
          north_arrow_style:
            placement: "top-left"
          legend_style:
            title: "Encounter Rate (per km)"
            format_title: false
            placement: "bottom-right"
          static: false
          max_zoom: 20
          widget_id: ${{ workflow.set_rate_map_title.return }}
        mapvalues:
          argnames: geo_layers
          argvalues: ${{ workflow.rate_polygon_layer.return }}

      - name: Persist Encounter Rate Ecomap
        id: rate_ecomap_html_urls
        task: persist_text
        partial:
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: "encounter_rate_map"
        mapvalues:
          argnames: text
          argvalues: ${{ workflow.rate_ecomap.return }}

      - name: Create Encounter Rate Map Widget
        id: rate_map_widgets
        task: create_map_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: ${{ workflow.set_rate_map_title.return }}
        map:
          argnames: [view, data]
          argvalues: ${{ workflow.rate_ecomap_html_urls.return }}

      - name: Merge Rate Map Widget Views
        id: grouped_rate_map_widget
        task: merge_widget_views
        partial:
          widgets: ${{ workflow.rate_map_widgets.return }}

  # ── Patrol Trajectories + Events Map ──
  - name: Set Patrol Map Title
    id: set_patrol_map_title
    task: set_string_var
    partial:
      var: "Patrol Trajectories and Events Map"

  - name: Rename Trajectory Columns for Display
    id: rename_traj_display_cols
    task: map_columns
    partial:
      drop_columns: []
      retain_columns: []
      raise_if_not_found: false
      rename_columns:
        patrol_serial_number: "Patrol Serial"
        patrol_type__display: "Patrol Type"
        segment_start: "Start Time"
        timespan_seconds: "Duration (s)"
        speed_kmhr: "Speed (kph)"
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.split_traj_groups.return }}

  - name: Rename Event Columns for Display
    id: rename_event_display_cols
    task: map_columns
    partial:
      drop_columns: []
      retain_columns: []
      raise_if_not_found: false
      rename_columns:
        patrol_serial_number: "Patrol Serial"
        event_type: "Event Type"
        time: "Event Time"
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.split_pe_groups.return }}

  - name: Create Trajectory Map Layers
    id: traj_map_layers
    task: create_polyline_layer
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
        - all_geometry_are_none
    partial:
      layer_style:
        get_width: 3
        width_units: "pixels"
        color_column: "patrol_traj_colormap"
      legend:
        label_column: ${{ workflow.set_patrol_traj_color_column.return }}
        color_column: "patrol_traj_colormap"
      tooltip_columns: ["Patrol Serial", "Patrol Type", "Start Time", "Duration (s)", "Speed (kph)"]
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.rename_traj_display_cols.return }}

  - name: Create Event Map Layers
    id: event_map_layers
    task: create_point_layer
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
        - all_geometry_are_none
    partial:
      layer_style:
        fill_color_column: "event_type_colormap"
        get_radius: 5
      legend: null
      tooltip_columns: ["Patrol Serial", "Event Type", "Event Time"]
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.rename_event_display_cols.return }}

  - name: Combine Traj and Event Layers
    id: combined_traj_event_layers
    task: groupbykey
    skipif:
      conditions:
        - any_dependency_skipped
        - all_keyed_iterables_are_skips
      unpack_depth: 1
    partial:
      iterables:
        - ${{ workflow.traj_map_layers.return }}
        - ${{ workflow.event_map_layers.return }}

  - name: Draw Patrol Ecomaps
    id: patrol_ecomap
    task: draw_ecomap
    partial:
      title: null
      tile_layers: ${{ workflow.base_map_defs.return }}
      north_arrow_style:
        placement: "top-left"
      legend_style:
        title: ${{ workflow.set_patrol_traj_color_column.return }}
        format_title: true
        placement: "bottom-right"
      static: false
      max_zoom: 20
      widget_id: ${{ workflow.set_patrol_map_title.return }}
    mapvalues:
      argnames: geo_layers
      argvalues: ${{ workflow.combined_traj_event_layers.return }}

  - name: Persist Patrol Ecomaps
    id: patrol_ecomap_html_urls
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: "patrol_map"
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.patrol_ecomap.return }}

  - name: Create Patrol Map Widgets
    id: patrol_map_widgets
    task: create_map_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: ${{ workflow.set_patrol_map_title.return }}
    map:
      argnames: [view, data]
      argvalues: ${{ workflow.patrol_ecomap_html_urls.return }}

  - name: Merge Patrol Map Views
    id: grouped_patrol_map_widget
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.patrol_map_widgets.return }}

  # ── Encounter Rate & Effort Stats (per group) ──
  - title: Encounter Rate
    type: task-group
    description: >-
      Calculate encounter rates and patrol effort totals.
    tasks:
      - name: "Set Total Hours Title"
        id: set_total_hours_title
        task: set_string_var
        partial:
          var: "Total Patrol Hours"

      - name: "Set Rate Per Hour Title"
        id: set_rate_hr_title
        task: set_string_var
        partial:
          var: "Events Per Hour"

      - name: "Set Total Km Title"
        id: set_total_km_title
        task: set_string_var
        partial:
          var: "Total Patrol Km"

      - name: "Set Rate Per Km Title"
        id: set_rate_km_title
        task: set_string_var
        partial:
          var: "Events Per Km"

      - name: "Set Total Events Title"
        id: set_total_events_title
        task: set_string_var
        partial:
          var: "Total Events"

      - name: Calculate Encounter Stats
        id: encounter_stats_sql
        task: apply_sql_query
        partial:
          query: >-
            SELECT
              CAST(COUNT(*) AS FLOAT) AS total_events,
              (SELECT SUM(t) FROM (SELECT DISTINCT patrol_id, total_time_s AS t FROM df)) / 3600.0 AS total_hours,
              CAST(COUNT(*) AS FLOAT) * 3600.0 / NULLIF(
                (SELECT SUM(t) FROM (SELECT DISTINCT patrol_id, total_time_s AS t FROM df)),
                0
              ) AS events_per_hour,
              (SELECT SUM(d) FROM (SELECT DISTINCT patrol_id, total_dist_m AS d FROM df)) / 1000.0 AS total_km,
              CAST(COUNT(*) AS FLOAT) * 1000.0 / NULLIF(
                (SELECT SUM(d) FROM (SELECT DISTINCT patrol_id, total_dist_m AS d FROM df)),
                0
              ) AS events_per_km
            FROM df
          columns: ["patrol_id", "total_dist_m", "total_time_s"]
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.split_pe_groups.return }}

      - name: Extract Total Events
        id: total_events_value
        task: dataframe_column_mean
        partial:
          column_name: "total_events"
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.encounter_stats_sql.return }}

      - name: Extract Total Hours
        id: total_hours_value
        task: dataframe_column_mean
        partial:
          column_name: "total_hours"
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.encounter_stats_sql.return }}

      - name: Extract Events Per Hour
        id: rate_per_hr_value
        task: dataframe_column_mean
        partial:
          column_name: "events_per_hour"
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.encounter_stats_sql.return }}

      - name: Extract Total Km
        id: total_km_value
        task: dataframe_column_mean
        partial:
          column_name: "total_km"
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.encounter_stats_sql.return }}

      - name: Extract Events Per Km
        id: rate_per_km_value
        task: dataframe_column_mean
        partial:
          column_name: "events_per_km"
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.encounter_stats_sql.return }}

      - name: Create Total Hours Widget
        id: total_hours_widget
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: ${{ workflow.set_total_hours_title.return }}
          decimal_places: 1
        map:
          argnames: [view, data]
          argvalues: ${{ workflow.total_hours_value.return }}

      - name: Create Rate Per Hour Widget
        id: rate_hr_widget
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: ${{ workflow.set_rate_hr_title.return }}
          decimal_places: 2
        map:
          argnames: [view, data]
          argvalues: ${{ workflow.rate_per_hr_value.return }}

      - name: Create Total Km Widget
        id: total_km_widget
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: ${{ workflow.set_total_km_title.return }}
          decimal_places: 1
        map:
          argnames: [view, data]
          argvalues: ${{ workflow.total_km_value.return }}

      - name: Create Rate Per Km Widget
        id: rate_km_widget
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: ${{ workflow.set_rate_km_title.return }}
          decimal_places: 2
        map:
          argnames: [view, data]
          argvalues: ${{ workflow.rate_per_km_value.return }}

      - name: Merge Total Hours Views
        id: grouped_total_hours_widget
        task: merge_widget_views
        partial:
          widgets: ${{ workflow.total_hours_widget.return }}

      - name: Merge Rate Per Hour Views
        id: grouped_rate_hr_widget
        task: merge_widget_views
        partial:
          widgets: ${{ workflow.rate_hr_widget.return }}

      - name: Merge Total Km Views
        id: grouped_total_km_widget
        task: merge_widget_views
        partial:
          widgets: ${{ workflow.total_km_widget.return }}

      - name: Create Total Events Widget
        id: total_events_widget
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: ${{ workflow.set_total_events_title.return }}
          decimal_places: 0
        map:
          argnames: [view, data]
          argvalues: ${{ workflow.total_events_value.return }}

      - name: Merge Rate Per Km Views
        id: grouped_rate_km_widget
        task: merge_widget_views
        partial:
          widgets: ${{ workflow.rate_km_widget.return }}

      - name: Merge Total Events Views
        id: grouped_total_events_widget
        task: merge_widget_views
        partial:
          widgets: ${{ workflow.total_events_widget.return }}

  # ── Persist ──
  - name: Persist Patrol Trajectories
    id: persist_patrol_traj
    task: persist_df_wrapper
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.split_traj_groups.return }}
    skipif:
      conditions:
        - never

  - name: Persist Patrol Events
    id: persist_patrol_events
    task: persist_df_wrapper
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.split_pe_groups.return }}
    skipif:
      conditions:
        - never

  # ── Report (skipped by default) ──
  - title: Generate Report
    type: task-group
    description: >-
      Generate a Word document report summarizing encounter rate results.
    tasks:
      - name: Skip Report Generation
        id: set_skip_report
        task: set_bool_var

      - name: Calculate Report Stats
        id: report_stats_sql
        task: apply_sql_query
        partial:
          query: >-
            SELECT
              CAST(COUNT(*) AS FLOAT) AS "Total Events",
              ROUND((SELECT SUM(t) FROM (SELECT DISTINCT patrol_id, total_time_s AS t FROM df)) / 3600.0, 1) AS "Total Patrol Hours",
              ROUND(CAST(COUNT(*) AS FLOAT) * 3600.0 / NULLIF(
                (SELECT SUM(t) FROM (SELECT DISTINCT patrol_id, total_time_s AS t FROM df)),
                0
              ), 2) AS "Events Per Hour",
              ROUND((SELECT SUM(d) FROM (SELECT DISTINCT patrol_id, total_dist_m AS d FROM df)) / 1000.0, 1) AS "Total Patrol Km",
              ROUND(CAST(COUNT(*) AS FLOAT) * 1000.0 / NULLIF(
                (SELECT SUM(d) FROM (SELECT DISTINCT patrol_id, total_dist_m AS d FROM df)),
                0
              ), 2) AS "Events Per Km"
            FROM df
          columns: ["patrol_id", "total_dist_m", "total_time_s"]
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.split_pe_groups.return }}

      - name: Create Encounter Rate Report
        id: create_encounter_report
        task: ecoscope_workflows_ext_custom.tasks.results.create_docx
        skipif:
          conditions:
            - never
        partial:
          skip: ${{ workflow.set_skip_report.return }}
          context:
            items:
              - item_type: timerange
                key: report_date
                value: ${{ workflow.time_range.return }}
                format: "%b %Y"
              - item_type: table
                key: encounter_stats
                value: ${{ workflow.report_stats_sql.return }}
                merge_groups: true
              - item_type: image
                key: patrol_maps
                value: ${{ workflow.patrol_ecomap_html_urls.return }}
                screenshot_config:
                  wait_for_timeout: 20000
                  max_concurrent_pages: 2
                  device_scale_factor: 1.0
              - item_type: image
                key: rate_maps
                value: ${{ workflow.rate_ecomap_html_urls.return }}
                screenshot_config:
                  wait_for_timeout: 20000
                  max_concurrent_pages: 2
                  device_scale_factor: 1.0
          groupers: ${{ workflow.groupers.return }}
          output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_prefix: encounter_rate_report

  # ── Dashboard ──
  # Row 1: Total Events | Total Hours | Events/Hr | Total Km | Events/Km
  # Row 2: Patrol+Events Map | Encounter Rate Grid Map
  - name: Create Dashboard
    id: encounter_dashboard
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return }}
      widgets:
        - ${{ workflow.grouped_total_events_widget.return }}
        - ${{ workflow.grouped_total_hours_widget.return }}
        - ${{ workflow.grouped_rate_hr_widget.return }}
        - ${{ workflow.grouped_total_km_widget.return }}
        - ${{ workflow.grouped_rate_km_widget.return }}
        - ${{ workflow.grouped_patrol_map_widget.return }}
        - ${{ workflow.grouped_rate_map_widget.return }}
      groupers: ${{ workflow.groupers.return }}
      time_range: ${{ workflow.time_range.return }}
